# Site configuration. Written by Alasin's create-site; yours to change.
baseURL = "__SITE_URL__/"
title = "__SITE_TITLE__"
locale = "__LANGUAGE__"
enableRobotsTXT = true

# The theme, as a Hugo module (needs Go; see README.md). Update with
# `hugo mod get -u` and commit go.mod and go.sum.
[module]
  [[module.imports]]
    path = "github.com/adityatelange/hugo-PaperMod"

[taxonomies]
  category = "categories"
  tag = "tags"

[markup.goldmark.parser]
  # Lets images be rendered as blocks (figures), see layouts/_default/_markup/render-image.html.
  wrapStandAloneImageWithinParagraph = false

[params]
  env = "production"
  mainSections = ["posts"]
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowToc = false

  # How Alasin refers to published images: Markdown and front matter use
  # contentPrefix + the image's key in the media bucket; the site shows them
  # from mediaURL (the bucket's public URL). Match [media] in alasin.toml.
  [params.alasin]
    contentPrefix = "/img/"
    mediaURL = "__MEDIA_URL__"

[menus]
  [[menus.main]]
    name = "Posts"
    pageRef = "/posts"
    weight = 10
  [[menus.main]]
    name = "Categories"
    pageRef = "/categories"
    weight = 20
  [[menus.main]]
    name = "Tags"
    pageRef = "/tags"
    weight = 30
