# SPDX-License-Identifier: MIT
# After each merge to main, release-please opens or updates a release PR
# (version bump in package.json + CHANGELOG.md). Merging that PR creates the
# tag vX.Y.Z and the GitHub Release.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
