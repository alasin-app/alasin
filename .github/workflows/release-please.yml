# SPDX-License-Identifier: MIT
# After each merge to main, release-please opens or updates a release PR
# (version bump in package.json + CHANGELOG.md). Merging that PR creates the
# tag vX.Y.Z and the GitHub Release, and then the release is deployed to
# production (deploy.yml, when ALASIN_DEPLOY allows it).
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  deploy:
    name: deploy
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' && (vars.ALASIN_DEPLOY == 'true' || vars.ALASIN_DEPLOY == 'production')
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
