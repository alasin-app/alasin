# SPDX-License-Identifier: MIT
# Markdown style, checked by `npm run lint`.
config:
  default: true
  MD013: false # prose paragraphs are kept on one line
  MD060:
    style: compact
ignores:
  - node_modules/**
  - dist/**
  - .local/**
  - .alasin/**
  - .wrangler/**
  - CHANGELOG.md # generated by release-please
